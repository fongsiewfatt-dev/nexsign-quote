<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXSIGN 新帜 — 橱柜智能报价系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --blue: #0A2351; --orange: #FF7A00; --red: #E6212A;
      --bg: #f7f8fa;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: #1a1a1a; line-height: 1.5; }

    .login-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0A2351 0%, #16213e 100%); padding: 20px;
    }
    .login-card {
      background: #fff; border-radius: 20px; padding: 36px 24px; width: 100%; max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }
    .logo-text { font-size: 32px; font-weight: 800; color: var(--blue); text-align: center; }
    .logo-text span { color: var(--orange); }
    .logo-zh { font-size: 22px; font-weight: 700; color: var(--red); text-align: center; margin: 6px 0 12px; }
    .logo-tag { font-size: 12px; color: #888; text-align: center; margin-bottom: 28px; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 10px;
      border: 1px solid #e2e2e2; border-radius: 10px; font-size: 15px;
    }
    input:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,122,0,0.15); }
    .btn-primary {
      width: 100%; padding: 14px; background: var(--orange); color: #000;
      border: none; border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer;
    }
    .tip { margin-top: 16px; font-size: 13px; color: #999; text-align: center; }
    .error { color: var(--red); margin-top: 10px; text-align: center; min-height: 20px; }
    .hidden { display: none !important; }

    .top-nav {
      background: #fff; border-bottom: 1px solid #eee; padding: 12px 16px; position: sticky; top: 0; z-index: 100;
    }
    .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .brand { font-weight: 700; font-size: 16px; color: var(--blue); }
    .brand span { color: var(--orange); }
    .btn-logout { border: none; background: #f5f5f5; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .nav-tabs { display: flex; gap: 6px; overflow-x: auto; }
    .tab { padding: 10px 14px; border-radius: 10px; background: #f5f5f5; cursor: pointer; font-size: 14px; white-space: nowrap; }
    .tab.active { background: var(--orange); font-weight: 600; }

    .container { padding: 16px; }
    .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
    .title { font-size: 17px; font-weight: 700; margin-bottom: 18px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; }
    .grid { display: grid; gap: 14px; }
    select {
      width: 100%; padding: 12px 14px; border: 1px solid #e2e2e2; border-radius: 10px; font-size: 15px;
    }
    .search { width: 100%; padding: 12px 16px; border: 1px solid #e5e5e5; border-radius: 12px; margin-bottom: 16px; font-size: 16px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
    th { background: #f8f9fa; padding: 12px 8px; text-align: left; font-size: 12px; color: #555; border-bottom: 1px solid #eee; white-space: nowrap; }
    td { padding: 10px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
    td input { padding: 8px 6px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; width: 100%; margin: 0; }
    td input[readonly] { background: #f9f9f9; color: #666; border-color: transparent; }
    .text-right { text-align: right; }
    .total { text-align: right; padding: 18px 10px; font-weight: 700; font-size: 17px; }
    .total span { color: var(--orange); font-size: 24px; font-weight: 800; }
    .btn-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .btn { flex: 1; min-width: 100px; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-o { background: var(--orange); color: #000; }
    .btn-b { background: var(--blue); color: #fff; }
    .btn-g { background: #f0f0f0; color: #333; }
    .btn-sm { flex: none; padding: 9px 14px; font-size: 13px; }
    .btn-use { padding: 8px 14px; background: #22c55e; border: none; border-radius: 7px; font-weight: 600; cursor: pointer; font-size: 13px; color: #fff; white-space: nowrap; }
    .btn-del { border: none; background: none; color: var(--red); font-size: 20px; cursor: pointer; padding: 4px 8px; }
    .add-box { 
      background: #fff9f0; border: 2px solid var(--orange); border-radius: 16px; padding: 22px 20px; margin-bottom: 24px;
    }
    .add-box__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; }
    .copyright { text-align: center; margin-top: 30px; font-size: 12px; color: #aaa; }
    @media print {
      .top-nav, .btn-bar, .login-wrap, .add-box { display: none !important; }
      body { background: #fff; }
    }
  </style>
</head>
<body>
  <div id="loginPage" class="login-wrap">
    <div class="login-card">
      <div class="logo-text"><span>NEX</span>SIGN</div>
      <div class="logo-zh">新 帜</div>
      <div class="logo-tag">携手新帜，定义未来标杆<br/>完整报价体系 · 可编辑 · 自定义加价</div>
      <input type="text" id="u" placeholder="账号" />
      <input type="password" id="p" placeholder="密码" />
      <button class="btn-primary" onclick="checkLogin()">登录系统</button>
      <div class="error" id="err"></div>
      <div class="tip">账号：admin / 密码：admin123</div>
    </div>
  </div>

  <div id="mainPage" class="hidden">
    <nav class="top-nav">
      <div class="nav-top">
        <div class="brand"><span>N</span>EXSIGN · 新帜</div>
        <button class="btn-logout" onclick="logout()">退出</button>
      </div>
      <div class="nav-tabs">
        <div class="tab active" data-page="quote">新建报价</div>
        <div class="tab" data-page="stock">材料库</div>
        <div class="tab" data-page="settings">设置</div>
      </div>
    </nav>

    <div class="container">
      <div id="page-quote" class="page">
        <div class="card">
          <div class="title">客户信息</div>
          <div class="grid">
            <div><label>客户姓名</label><input type="text" id="cname" /></div>
            <div><label>联系电话</label><input type="tel" id="cphone" /></div>
            <div><label>日期</label><input type="date" id="qdate" /></div>
            <div><label>报价编号</label><input type="text" id="qno" readonly /></div>
            <div><label>业务员</label><input type="text" id="sales" readonly /></div>
            <div><label>备注</label><input type="text" id="remark" /></div>
          </div>
        </div>

        <div class="card">
          <div class="title">报价明细 <button class="btn btn-sm btn-g" onclick="clearAll()">清空</button></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>项目名称</th><th>单位</th>
                  <th class="text-right">单价(RM)</th><th class="text-right">数量</th>
                  <th class="text-right">金额(RM)</th><th></th>
                </tr>
              </thead>
              <tbody id="list"></tbody>
              <tfoot>
                <tr>
                  <td colspan="5" class="total">总额：<span id="total">0.00</span></td>
                </tr>
              </tfoot>
            </table>
          </div>
          <div class="btn-bar">
            <button class="btn btn-sm btn-b" onclick="goPage('stock')">+ 从材料库选</button>
            <button class="btn btn-sm btn-g" onclick="addRow()">手动添加</button>
          </div>
        </div>

        <div class="btn-bar">
          <button class="btn btn-b" onclick="saveQuote()">保存报价</button>
          <button class="btn btn-o" onclick="window.print()">打印/PDF</button>
        </div>
      </div>

      <div id="page-stock" class="page hidden">
        <div class="card">
          <div class="title">材料库（直接改 → 自动保存）</div>
          
          <div class="add-box">
            <div class="title" style="margin-bottom:12px;">➕ 添加新项目</div>
            <div class="add-box__grid">
              <div><label>分类</label>
                <select id="newCat">
                  <option value="MATERIAL">材质板材</option>
                  <option value="KITCHEN">厨房</option>
                  <option value="BEDROOM">卧房</option>
                  <option value="DRESSING">梳妆/书房</option>
                  <option value="LIVING">客厅</option>
                  <option value="FOYER">玄关</option>
                  <option value="ACCESSORY">配件</option>
                </select>
              </div>
              <div><label>名称</label><input type="text" id="newName" /></div>
              <div><label>单位</label><input type="text" id="newUnit" value="ft" /></div>
              <div><label>基础价(RM)</label><input type="number" id="newPrice" /></div>
            </div>
            <div class="btn-bar" style="margin-top:14px;">
              <button class="btn btn-o" onclick="addStockItem()">✅ 添加</button>
              <button class="btn btn-g" onclick="clearNewForm()">清空</button>
            </div>
          </div>

          <input type="text" class="search" id="search" placeholder="🔍 搜索…" oninput="renderStock()" />
          
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>分类</th><th>项目名称</th><th>单位</th>
                  <th class="text-right">基础价</th><th class="text-right">报价</th><th>操作</th>
                </tr>
              </thead>
              <tbody id="stockList"></tbody>
            </table>
          </div>
          
          <div class="btn-bar" style="margin-top:20px;">
            <button class="btn btn-g" onclick="resetStock()">恢复原始清单</button>
            <button class="btn btn-b" onclick="goPage('quote')">← 返回报价单</button>
          </div>
        </div>
      </div>

      <div id="page-settings" class="page hidden">
        <div class="card">
          <div class="title">⚙️ 系统设置</div>
          <div style="margin-bottom:20px;">
            <label style="display:inline-block; width:140px;">加价比例：</label>
            <input type="number" id="markupPercent" value="50" style="width:100px;" /> %
            → 倍率：<strong id="rateDisplay">×1.50</strong>
          </div>
          <button class="btn btn-o" onclick="saveMarkup()" style="margin-bottom:24px;">💾 保存加价</button>
          
          <p style="font-size:12px; color:#888;">💡 直接改材料库 → 自动保存；报价单单价可直接改</p>
        </div>
      </div>

      <div class="copyright">© 2026 NEXSIGN 新帜</div>
    </div>
  </div>

  <script>
    const accounts = { admin: "admin123" };
    let markupPercent = parseInt(localStorage.getItem("markupPercent")) || 50;
    
    const originalStock = [
      { cat: "MATERIAL", name: "Melamine E0 NO WARRANTY", unit: "ft", original: 400 },
      { cat: "MATERIAL", name: "Melamine E1 NO WARRANTY", unit: "ft", original: 350 },
      { cat: "KITCHEN", name: "Base Unit 700mm", unit: "ft", original: 400 },
      { cat: "KITCHEN", name: "Base Unit 800mm", unit: "ft", original: 420 },
      { cat: "KITCHEN", name: "Base Unit 900mm", unit: "ft", original: 450 },
      { cat: "KITCHEN", name: "Wall Unit 700mm", unit: "ft", original: 220 },
      { cat: "KITCHEN", name: "Wall Unit 800mm", unit: "ft", original: 230 },
      { cat: "KITCHEN", name: "Wall Unit 900mm", unit: "ft", original: 240 },
      { cat: "BEDROOM", name: "Wardrobe 8ft", unit: "ft", original: 450 },
      { cat: "BEDROOM", name: "Wardrobe 9ft", unit: "ft", original: 480 },
      { cat: "BEDROOM", name: "Wardrobe 10ft", unit: "ft", original: 525 },
      { cat: "ACCESSORY", name: "LED Light", unit: "pcs", original: 150 },
      { cat: "ACCESSORY", name: "Delivery", unit: "lot", original: 200 }
    ];

    let priceList = [];
    function loadStock() {
      const saved = localStorage.getItem("nexsignStock");
      priceList = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(originalStock));
    }
    function saveStock() { localStorage.setItem("nexsignStock", JSON.stringify(priceList)); }
    function resetStock() {
      if(confirm("确定恢复原始清单？自定义项目会清空！")) {
        localStorage.removeItem("nexsignStock");
        priceList = JSON.parse(JSON.stringify(originalStock));
        renderStock();
      }
    }

    let rowId = 0;
    function getRate() { return 1 + markupPercent / 100; }
    function updateRateDisplay() {
      document.getElementById("rateDisplay").textContent = "×" + getRate().toFixed(2);
    }

    function checkLogin() {
      const u = document.getElementById("u").value.trim();
      const p = document.getElementById("p").value;
      if (accounts[u] && accounts[u] === p) {
        localStorage.setItem("user", u);
        loadStock();
        enterMain(u);
      } else {
        document.getElementById("err").textContent = "账号或密码错误";
      }
    }
    function enterMain(name) {
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("mainPage").classList.remove("hidden");
      document.getElementById("sales").value = name;
      document.getElementById("qdate").valueAsDate = new Date();
      document.getElementById("markupPercent").value = markupPercent;
      updateRateDisplay();
      bindTab();
    }
    function logout() { localStorage.removeItem("user"); location.reload(); }
    const savedUser = localStorage.getItem("user");
    if (savedUser) { loadStock(); enterMain(savedUser); }

    function bindTab() {
      document.querySelectorAll(".tab").forEach(tab => {
        tab.addEventListener("click", () => {
          const pg = tab.dataset.page;
          document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.page === pg));
          document.querySelectorAll(".page").forEach(p => p.classList.toggle("hidden", p.id !== `page-${pg}`));
          if (pg === "stock") renderStock();
        });
      });
    }
    function goPage(pg) {
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.page === pg));
      document.querySelectorAll(".page").forEach(p => p.classList.toggle("hidden", p.id !== `page-${pg}`));
      if (pg === "stock") renderStock();
    }

    function saveMarkup() {
      const val = parseInt(document.getElementById("markupPercent").value);
      if (val >= 0 && val <= 300) {
        markupPercent = val;
        localStorage.setItem("markupPercent", val);
        updateRateDisplay();
        renderStock();
        alert("✅ 加价已保存：+" + val + "%");
      } else alert("⚠️ 请输入 0–300 之间的数字");
    }

    function clearNewForm() {
      document.getElementById("newName").value = "";
      document.getElementById("newUnit").value = "ft";
      document.getElementById("newPrice").value = "";
      document.getElementById("newCat").selectedIndex = 0;
    }

    function addStockItem() {
      const cat = document.getElementById("newCat").value;
      const name = document.getElementById("newName").value.trim();
      const unit = document.getElementById("newUnit").value.trim() || "ft";
      const price = parseFloat(document.getElementById("newPrice").value);
      if (!name) { alert("⚠️ 请填写项目名称！"); return; }
      if (!price || price <= 0) { alert("⚠️ 请填写基础价！"); return; }
      priceList.push({ cat, name, unit, original: price });
      saveStock();
      clearNewForm();
      renderStock();
      alert("✅ 添加成功！");
    }

    function deleteStockItem(idx) {
      if (confirm("确定删除？")) {
        priceList.splice(idx, 1);
        saveStock();
        renderStock();
      }
    }

    function renderStock() {
      let list = priceList;
      const kw = document.getElementById("search")?.value.trim().toLowerCase() || "";
      if (kw) list = priceList.filter(r => r.name.toLowerCase().includes(kw));
      
      let html = "";
      list.forEach((r) => {
        const realIdx = priceList.indexOf(r);
        const quotePrice = (r.original * getRate()).toFixed(2);
        html += `
          <tr>
            <td><select onchange="updateStockField(${realIdx}, 'cat', this.value)">
              <option value="MATERIAL" ${r.cat==='MATERIAL'?'selected':''}>材质</option>
              <option value="KITCHEN" ${r.cat==='KITCHEN'?'selected':''}>厨房</option>
              <option value="BEDROOM" ${r.cat==='BEDROOM'?'selected':''}>卧房</option>
              <option value="ACCESSORY" ${r.cat==='ACCESSORY'?'selected':''}>配件</option>
            </select></td>
            <td><input type="text" value="${r.name}" onchange="updateStockField(${realIdx}, 'name', this.value)" /></td>
            <td><input type="text" value="${r.unit}" onchange="updateStockField(${realIdx}, 'unit', this.value)" style="width:60px;" /></td>
            <td class="text-right"><input type="number" value="${r.original}" onchange="updateStockField(${realIdx}, 'original', parseFloat(this.value))" style="width:80px;" /></td>
            <td class="text-right" style="color:var(--orange);font-weight:bold;">RM ${quotePrice}</td>
            <td style="white-space:nowrap;">
              <button class="btn-use" onclick="pick(${realIdx})">选用</button>
              <button class="btn-del" onclick="deleteStockItem(${realIdx})">×</button>
            </td>
          </tr>
        `;
      });
      document.getElementById("stockList").innerHTML = html;
    }

    function updateStockField(idx, field, value) {
      if (priceList[idx]) {
        priceList[idx][field] = value;
        saveStock();
        renderStock();
      }
    }

    function pick(i) {
      const r = priceList[i];
      const price = +(r.original * getRate()).toFixed(2);
      addRowData({ name: r.name, unit: r.unit, price: price });
      goPage('quote');
    }

    function addRowData(d) {
      rowId++;
      const tr = document.createElement("tr");
      tr.id = `r${rowId}`;
      tr.innerHTML = `
        <td>${rowId}</td>
        <td><input type="text" value="${d?.name||''}" readonly /></td>
        <td><input type="text" value="${d?.unit||'ft'}" readonly /></td>
        <td class="text-right"><input type="number" value="${d?.price||0}" oninput="calc()" step="0.01" /></td>
        <td class="text-right"><input type="number" value="1" oninput="calc()" step="0.01" /></td>
        <td class="text-right" style="font-weight:bold;color:var(--orange);">0.00</td>
        <td><button class="btn-del" onclick="del(${rowId})">×</button></td>
      `;
      document.getElementById("list").appendChild(tr);
      calc();
    }
    function addRow() { addRowData(null); }
    function del(id) { document.getElementById(`r${id}`)?.remove(); reNum(); calc(); }
    function reNum() { document.querySelectorAll("#list tr").forEach((r,i)=>r.querySelector("td:first-child").textContent=i+1); }
    function clearAll() { if(confirm("确定清空？")){document.getElementById("list").innerHTML="";rowId=0;} }

    function calc() {
      let sum = 0;
      document.querySelectorAll("#list tr").forEach(row => {
        const p = parseFloat(row.querySelector("td:nth-child(4) input").value) || 0;
        const q = parseFloat(row.querySelector("td:nth-child(5) input").value) || 0;
        const amt = p * q;
        row.querySelector("td:nth-child(6)").textContent = amt.toFixed(2);
        sum += amt;
      });
      document.getElementById("total").textContent = sum.toFixed(2);
    }

    function saveQuote() {
      const no = "NX-" + new Date().toISOString().slice(0,10).replace(/-/g,"") + "-" + Math.floor(Math.random()*900+100);
      document.getElementById("qno").value = no;
      alert("✅ 保存成功！编号：" + no);
    }
  </script>
</body>
</html>
